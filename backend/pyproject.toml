[project]
name = "nexo-ine"
version = "0.1.0"
description = "Nexo: plataforma integrada de automatización estadística (prototipo Datatón INE 2026)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "S"]
ignore = ["S101", "S311", "S603", "S607", "B008", "E731"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
